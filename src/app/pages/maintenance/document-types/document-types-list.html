<div class="card-list">
  <div class="card-list__header">
    <div>
      <h3>Tipos de documento</h3>
      <p>Gestión de tipos de documento del sistema.</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()" title="Agregar">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <div class="table-wrap">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Código</th>
          <th>Descripción</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of paginatedItems()">
          <td>{{ item.id }}</td>
          <td>{{ item.code }}</td>
          <td>{{ item.description }}</td>
          <td>
            <span class="badge" [ngClass]="item.status === 'Activo' ? 'bg-success' : 'bg-secondary'">
              {{ item.status }}
            </span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-primary me-2" (click)="edit(item)" title="Editar">
              <i class="bi bi-pencil-square"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="remove(item.id)" title="Eliminar">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="pagination-row">
    <button class="btn btn-outline-secondary btn-sm" [disabled]="page() === 1" (click)="prevPage()" title="Anterior">
      <i class="bi bi-chevron-left"></i>
    </button>
    <span>Página {{ page() }} de {{ totalPages() }}</span>
    <button class="btn btn-outline-secondary btn-sm" [disabled]="page() === totalPages()" (click)="nextPage()" title="Siguiente">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>

<app-document-types-form
  *ngIf="isModalOpen()"
  [item]="selectedItem()"
  (saved)="onSaved($event)"
  (closed)="closeModal()"
></app-document-types-form>
