<div class="container mt-4">
  <h2>{{ isEditMode ? 'Editar Rol' : 'Nuevo Rol' }}</h2>

  <form [formGroup]="rolForm" (ngSubmit)="guardarRol()">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre</label>
      <input
        id="nombre"
        type="text"
        class="form-control"
        formControlName="nombre"
      />
      <div class="text-danger" *ngIf="rolForm.get('nombre')?.invalid && rolForm.get('nombre')?.touched">
        El nombre es obligatorio.
      </div>
    </div>

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción</label>
      <textarea
        id="descripcion"
        class="form-control"
        formControlName="descripcion"
      ></textarea>
      <div class="text-danger" *ngIf="rolForm.get('descripcion')?.invalid && rolForm.get('descripcion')?.touched">
        La descripción es obligatoria.
      </div>
    </div>

    <div class="mb-3 form-check">
      <input
        id="activo"
        type="checkbox"
        class="form-check-input"
        formControlName="activo"
      />
      <label for="activo" class="form-check-label">Activo</label>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary" [disabled]="rolForm.invalid">
        {{ isEditMode ? 'Actualizar' : 'Crear' }}
      </button>
      <a routerLink="/seguridad/roles" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>
