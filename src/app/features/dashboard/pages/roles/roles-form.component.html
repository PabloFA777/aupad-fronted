<div class="container">
  <h2>{{ isEditMode ? 'Editar Rol' : 'Nuevo Rol' }}</h2>
  <form [formGroup]="rolForm" (ngSubmit)="guardarRol()">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" class="form-control" id="nombre" formControlName="nombre">
    </div>
    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea class="form-control" id="descripcion" formControlName="descripcion"></textarea>
    </div>
    <div class="form-group form-check">
      <input type="checkbox" class="form-check-input" id="activo" formControlName="activo">
      <label class="form-check-label" for="activo">Activo</label>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!rolForm.valid">Guardar</button>
  </form>
</div>
