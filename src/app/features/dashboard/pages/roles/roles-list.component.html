<div class="container">
  <h2>Lista de Roles</h2>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let rol of roles">
        <td>{{ rol.id }}</td>
        <td>{{ rol.nombre }}</td>
        <td>{{ rol.descripcion }}</td>
        <td>{{ rol.activo ? 'Sí' : 'No' }}</td>
        <td>
          <button class="btn btn-danger" (click)="eliminarRol(rol.id)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
