<div class="card-list">
  <div class="card-list__header">
    <div>
      <h3>Roles</h3>
      <p>Gestión de roles del sistema.</p>
    </div>
  </div>

  <div class="table-wrap">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
        </tr>
      </thead>
      <tbody>
        @for (role of roles(); track role.id) {
          <tr>
            <td>{{ role.id }}</td>
            <td>{{ role.nombre }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
