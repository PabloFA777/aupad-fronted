<div class="login-page">
  <div class="login-card">
    <app-brand [title]="'AUPAD'" [subtitle]="'Acceso al sistema'" />

    <form class="login-form" (ngSubmit)="login()">
      <label>
        <span>Correo</span>
        <input type="email" [(ngModel)]="email" name="email" placeholder="usuario@empresa.com" />
      </label>
      <label>
        <span>Contraseña</span>
        <input type="password" [(ngModel)]="password" name="password" placeholder="********" />
      </label>

      @if (errorMessage) {
        <div class="alert alert-danger py-2">{{ errorMessage }}</div>
      }

      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </div>
</div>
