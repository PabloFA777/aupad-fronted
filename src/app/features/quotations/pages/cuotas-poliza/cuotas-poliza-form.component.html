<div class="form-shell">
  <div class="form-shell__header">
    <h4>{{ item ? 'Editar cuota' : 'Nueva cuota' }}</h4>
    <button type="button" class="btn-close" (click)="close()" title="Cerrar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <form class="form-grid" (ngSubmit)="save()">
    <label>
      <span>Póliza</span>
      <select [(ngModel)]="form.polizaId" name="polizaId" required>
        @for (p of polizas; track p.id) {
          <option [value]="p.id">{{ p.numeroPoliza }}</option>
        }
      </select>
    </label>

    <label>
      <span>N° Cuota</span>
      <input type="number" [(ngModel)]="form.numeroCuota" name="numeroCuota" required />
    </label>

    <label>
      <span>Monto</span>
      <input type="number" step="0.01" [(ngModel)]="form.monto" name="monto" required />
    </label>

    <label>
      <span>Fecha Vencimiento</span>
      <input type="date" [(ngModel)]="form.fechaVencimientoCuota" name="fechaVencimientoCuota" required />
    </label>

    <label>
      <span>Estado</span>
      <select [(ngModel)]="form.estado" name="estado">
        @for (opt of estadoOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </label>

    <label>
      <span>Monto Pagado</span>
      <input type="number" step="0.01" [(ngModel)]="form.montoPagado" name="montoPagado" />
    </label>

    <label>
      <span>Fecha Pago</span>
      <input type="date" [(ngModel)]="form.fechaPago" name="fechaPago" />
    </label>

    <label>
      <span>Método Pago</span>
      <select [(ngModel)]="form.metodoPago" name="metodoPago">
        <option [value]="null">-- Ninguno --</option>
        @for (opt of metodoPagoOptions; track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </label>

    <div class="form-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-outline-secondary" (click)="close()" title="Cancelar">
        <i class="bi bi-x-lg"></i>
      </button>
      <button type="submit" class="btn btn-primary" title="Guardar">
        <i class="bi bi-check-lg"></i>
      </button>
    </div>
  </form>
</div>
