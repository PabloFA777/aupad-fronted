<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card__header">
      <h4>{{ item ? 'Editar seguro' : 'Agregar seguro' }}</h4>
      <button class="btn-close" type="button" (click)="close()" aria-label="Cerrar"></button>
    </div>

    <form class="row g-3" (ngSubmit)="save()">
      <div class="col-md-6">
        <label class="form-label">Categoría ID</label>
        <input class="form-control" type="number" [(ngModel)]="form.categoriaId" name="categoriaId" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Código</label>
        <input class="form-control" [(ngModel)]="form.codigo" name="codigo" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Nombre</label>
        <input class="form-control" [(ngModel)]="form.nombre" name="nombre" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Estado</label>
        <select class="form-select" [(ngModel)]="form.activo" name="activo">
          <option [ngValue]="true">Activo</option>
          <option [ngValue]="false">Inactivo</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" rows="3" [(ngModel)]="form.descripcion" name="descripcion" required></textarea>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </div>
</div>
