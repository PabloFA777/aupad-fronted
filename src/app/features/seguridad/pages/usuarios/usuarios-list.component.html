<div class="card-list">
  <div class="card-list__header">
    <div>
      <h3>Usuarios</h3>
      <p>Gestión de usuarios del sistema.</p>
    </div>
    <button class="btn btn-primary" (click)="openModal()" title="Agregar">
      <i class="bi bi-plus-lg"></i>
    </button>
  </div>

  <div class="table-wrap">
    <table class="table table-hover align-middle">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Correo</th>
          <th>Estado</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of paginatedItems(); track user.id) {
          <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.nombre }}</td>
            <td>{{ user.apellido }}</td>
            <td>{{ user.correo }}</td>
            <td>{{ user.estado }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-primary me-2" (click)="edit(user)" title="Editar">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button class="btn btn-sm btn-outline-danger" (click)="remove(user.id)" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="pagination-row">
    <button class="btn btn-outline-secondary btn-sm" [disabled]="page() === 1" (click)="prevPage()" title="Anterior">
      <i class="bi bi-chevron-left"></i>
    </button>
    <span>Página {{ page() }} de {{ totalPages() }}</span>
    <button class="btn btn-outline-secondary btn-sm" [disabled]="page() === totalPages()" (click)="nextPage()" title="Siguiente">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>

@if (isModalOpen()) {
  <div class="modal-backdrop">
    <div class="modal-card">
      <app-usuarios-form [item]="selectedItem()" (saved)="onSaved($event)" (closed)="closeModal()"></app-usuarios-form>
    </div>
  </div>
}
