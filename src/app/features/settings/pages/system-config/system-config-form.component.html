<div class="form-shell">
  <div class="form-shell__header">
    <h4>{{ item ? 'Editar configuración' : 'Nueva configuración' }}</h4>
    <button type="button" class="btn-close" (click)="close()" title="Cerrar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <form class="form-grid" (ngSubmit)="save()">
    <label>
      <span>Clave</span>
      <input type="text" [(ngModel)]="form.clave" name="clave" />
    </label>

    <label>
      <span>Valor</span>
      <input type="text" [(ngModel)]="form.valor" name="valor" />
    </label>

    <label>
      <span>Descripción</span>
      <input type="text" [(ngModel)]="form.descripcion" name="descripcion" />
    </label>

    <div class="form-actions">
      <button type="button" class="btn btn-outline-secondary" (click)="close()" title="Cancelar">
        <i class="bi bi-x-lg"></i>
      </button>
      <button type="submit" class="btn btn-primary" title="Guardar">
        <i class="bi bi-check-lg"></i>
      </button>
    </div>
  </form>
</div>
