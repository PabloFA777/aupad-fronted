<div class="form-shell">
  <div class="form-shell__header">
    <h4>{{ item ? 'Editar categoría de seguro' : 'Nueva categoría de seguro' }}</h4>
    <button type="button" class="btn-close" (click)="close()" title="Cerrar">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <form class="form-grid" (ngSubmit)="save()">
    <label>
      <span>Nombre</span>
      <input type="text" [(ngModel)]="form.nombre" name="nombre" />
    </label>

    <label>
      <span>Categoría Padre ID</span>
      <input type="number" [(ngModel)]="form.categoriaPadreId" name="categoriaPadreId" />
    </label>

    <div class="form-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-outline-secondary" (click)="close()" title="Cancelar">
        <i class="bi bi-x-lg"></i>
      </button>
      <button type="submit" class="btn btn-primary" title="Guardar">
        <i class="bi bi-check-lg"></i>
      </button>
    </div>
  </form>
</div>
