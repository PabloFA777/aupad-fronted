<div class="modal-backdrop" (click)="close()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="modal-card__header">
      <h4>{{ item ? 'Editar tipo de documento' : 'Agregar tipo de documento' }}</h4>
      <button class="btn-close" type="button" (click)="close()" aria-label="Cerrar" title="Cerrar">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form class="row g-3" (ngSubmit)="save()">
      <div class="col-md-6">
        <label class="form-label">Código</label>
        <input class="form-control" [(ngModel)]="form.code" name="code" required />
      </div>
      <div class="col-md-6">
        <label class="form-label">Estado</label>
        <select class="form-select" [(ngModel)]="form.status" name="status">
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Descripción</label>
        <textarea class="form-control" rows="3" [(ngModel)]="form.description" name="description" required></textarea>
      </div>

      <div class="col-12 d-flex justify-content-end gap-2">
        <button type="button" class="btn btn-outline-secondary" (click)="close()" title="Cancelar">
          <i class="bi bi-x-lg"></i>
        </button>
        <button type="submit" class="btn btn-primary" title="Guardar">
          <i class="bi bi-check-lg"></i>
        </button>
      </div>
    </form>
  </div>
</div>
